services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giecser_backend
    env_file:
      - .env
    ports:
      - 5000:5000
    environment:
      PORT: 5000
      GIN_MODE: release
    # Postgres + Redis live outside compose (VPS/Aiven) — connected via
    # DATABASE_URL and REDIS_URL in .env / Dokploy Environment Settings.
